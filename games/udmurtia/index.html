const DISTRICT_SECTIONS=[["Минеральные воды Варзи-Ятчи упоминаются в документах XIX века.","Минеральные источники и торфяные грязи Варзи-Ятчи.","С Алнашами связана жизнь Ашальчи Оки — первой удмуртской поэтессы и врача.","Мемориальный дом-музей Ашальчи Оки; Варзи-Ятчи."],["Поселения района исторически связаны с долиной Чепцы.","Река Чепца.","Традиции северных удмуртов, русских, чепецких татар и бесермян. Юнда — один из центров сохранения бесермянской культуры.","Районный музей в Балезино; Юндинский отдел музея."],["В Большой Докье родился Кузебай Герд. Свято-Никольский храм в Вавоже построен в 1835 году по проекту Семёна Дудина.","","Кузебай Герд — удмуртский поэт, писатель, педагог и исследователь народной культуры, собиратель фольклора.","Вавожский краеведческий музей; Свято-Никольский храм."],["Воткинск является отдельным муниципальным образованием и административным центром района.","Кама, Сива и их притоки. Часть территории входит в национальный парк «Нечкинский».","","Природные территории национального парка «Нечкинский»."],["История района связана со средневековыми поселениями и культурой предков удмуртов.","","Парк «ДондыДор» знакомит с преданиями и представлениями о жизни предков. Это современный культурный проект: художественные образы и легенды дополняют исторический рассказ.","Культурно-туристический парк «ДондыДор» у деревни Адам."],["История чувашской деревни Благодатное связана с переселением чувашей в начале XX века.","","В районе живут удмурты, русские, марийцы, кряшены и чуваши. Их традициям посвящены материалы районного музея.","Граховский краеведческий музей имени Ашальчи Оки; деревня Благодатное."],["По Сибирскому тракту двигались почта, товары, путешественники и ссыльные.","Байгурезь — возвышенность у реки Чепцы.","Байгурезь связан с археологическими памятниками и местными преданиями.","Музей истории Сибирского тракта; Байгурезь."],["Район окружает Ижевск; город является отдельным городским округом.","","«Лудорвай» знакомит с традиционной усадьбой, ремёслами и бытом. Здесь собраны дома, хозяйственные постройки, ветряная мельница и семейное святилище — куала.","Архитектурно-этнографический музей-заповедник «Лудорвай»."],["В Сепе сохраняют воспоминания о поселениях, которых больше нет: фотографии, предметы быта и рассказы жителей.","","Центр удмуртской культуры в Сундуре знакомит с Лопшо Педунем — героем юмористических рассказов.","Музей исчезнувших деревень в Сепе; Центр удмуртской культуры в Сундуре."],["Развитие района связано с демидовским заводским хозяйством, молотовыми фабриками, кузницами и переработкой металла.","","Промышленное наследие помогает понять, как менялись занятия жителей и развивалась техника.","Музей истории и культуры Камбарского района."],["","Парк «Усть-Бельск» связан с местом встречи Камы и Белой. Каракулинская пойма имеет международное значение для охраны птиц. Здесь важны пойменные водоёмы и заливные луга.","","Природный парк «Усть-Бельск»."],["","У Кулиги начинается Кама — здесь большая река представляет собой небольшой родниковый ручей.","В Кулиге сохраняются старообрядческие традиции и навыки работы с деревом, включая изготовление долблёных корыт.","Исток Камы; краеведческий музей «Истоки»."],["Село Короленко прежде называлось Старым Мултаном. В конце XIX века Владимир Короленко участвовал в защите несправедливо обвинённых удмуртов по Мултанскому делу.","","Материалы музея знакомят с традиционным сельским бытом. История Мултанского дела помогает говорить о справедливости и преодолении предрассудков.","Музей «Вуж Мултан» имени В. Г. Короленко."],["Фронтовые рисунки Петра Кривоногова сохраняют свидетельства о событиях войны.","","С районом связано имя художника-баталиста Петра Кривоногова, автора картины «Победа». В музее представлены его картины, эскизы и рисунки.","Киясовский районный музей Петра Кривоногова."],["","В заказнике «Кокманский» охраняются сосновые леса, верховые болота и материковые дюны. Среди сосен сохранились старые лиственницы Сукачёва. Здесь встречаются разные лесные и болотные сообщества.","","Ботанический заказник «Кокманский»."],["В 2012 году «Бурановские бабушки» заняли второе место на конкурсе «Евровидение».","","Коллектив из Буранова исполнял на удмуртском языке в том числе версии популярных песен, знакомя международную аудиторию с родным языком.","Село Бураново."],["Город Можга является отдельным муниципальным образованием.","Значительная часть района расположена в бассейне Валы. Поселения находятся по берегам Валы, Сюги и Ныши.","В районе сохраняются удмуртские сельские традиции. Гербер связан с завершением весенних полевых работ.",""],["Город Сарапул является отдельным муниципальным образованием; центр района — Сигаево.","Часть территории входит в парк «Нечкинский». Здесь охраняются леса и природные комплексы долины Камы. Орлан-белохвост занесён в Красную книгу России.","","Национальный парк «Нечкинский»; Музей орлана-белохвоста в Нечкине."],["Сибирский тракт способствовал торговле и росту Селтов.","","В парке миниатюр представлены деревянные модели сохранившихся и утраченных зданий из нескольких районов Удмуртии.","Историческая парковая зона «Сибирский тракт в миниатюре»."],["История района связана с южной ветвью Сибирского тракта.","Сюмсилка протекает через Сюмси и впадает в Кильмезь.","В Васькине сохранился сад со скульптурами Михаила Абашева — фигурами людей, животных и сказочных персонажей.","Сад скульптур Михаила Абашева в деревне Васькино."],["Развитие Увы в XX веке связано с лесозаготовками, переработкой древесины и железной дорогой.","Около деревни Эрестем установлен знак географического центра Удмуртии.","","Знак географического центра Удмуртии около Эрестема."],["В 2014 году Старые Быги стали первой культурной столицей финно-угорского мира.","Природный парк «Шаркан» охраняет местные ландшафты и природные сообщества.","В Старых Быгах развиваются проекты, связанные с удмуртским языком, традиционной кухней и сельской культурой; проводится фестиваль «Быг-Быг».","Старые Быги; природный парк «Шаркан»."],["Район относится к местам компактного проживания бесермян.","","Бесермяне — отдельный народ со своими культурными традициями. Особенности костюма рассказывают о возрасте человека и его положении в семье.","Юкаменский краеведческий музей: жилище, утварь и одежда бесермян."],["Музей носит имя Марии Шкляевой — его первого руководителя. Вещи и воспоминания жителей стали основой рассказа о местной истории.","","В районе изучают удмуртский фольклор, традиционный костюм и предметы сельского быта. Часть коллекции представлена в «Музее удмуртской сказки».","Якшур-Бодьинский районный краеведческий музей имени М. К. Шкляевой."],["Развитие Пудема связано с металлургическим заводом. Для его нужд в XVIII веке создали пруд.","Пудемский пруд — созданный человеком водоём, ставший частью местного ландшафта и повседневной жизни.","","Пудем и Пудемский пруд."]];
const REGION_CARDS=[["Алнаши","Юг Удмуртии. Природные особенности района — минеральные источники и торфяные грязи Варзи-Ятчи. Сведения об использовании местных минеральных вод встречаются в документах XIX века. С Алнашами связана жизнь Ашальчи Оки — первой удмуртской поэтессы и врача. В доме, где она жила, открыт мемориальный музей.","https://varzy.ru/about/","https://udm.travel/places/muzei/memorialnye-muzei/memorialnyy-dom-muzey-ashalchi-oki/"],["Балезино","История района связана с рекой Чепцой. Здесь соседствуют культурные традиции северных удмуртов, русских, чепецких татар и бесермян. Село Юнда — один из центров сохранения бесермянской культуры. Здесь знакомятся с национальной одеждой, домашней утварью, ремёслами и историей этого народа.","https://www.culture.ru/institutes/1165/balezinskii-raionnyi-muzei","https://www.culture.ru/institutes/90919/yundinskii-otdel-balezinskogo-raionnogo-istoriko-kraevedcheskogo-muzeya"],["Вавож","В деревне Большая Докья родился Кузебай Герд — удмуртский поэт, писатель, педагог и исследователь народной культуры. Он собирал фольклор и внёс большой вклад в развитие удмуртской литературы. В Вавоже сохранился Свято-Никольский храм, построенный в 1835 году по проекту архитектора Семёна Дудина.","https://nmur.ru/about/gerd","https://www.culture.ru/institutes/11486/vavozhskii-raionnyi-kraevedcheskii-muzei"],["Воткинск","Город Воткинск — административный центр района и отдельное муниципальное образование. По району протекают Кама, Сива и их притоки. Часть природных территорий входит в национальный парк «Нечкинский», расположенный также в Завьяловском и Сарапульском районах. Здесь можно изучать леса, речные берега и водные экосистемы Прикамья.","https://votray.ru/about/obshchie-svedeniya.php","https://oopt.info/index.php?oopt=846"],["Глазов","Город Глазов следует отличать от окружающего его района. В деревне Адам находится культурно-туристический парк «ДондыДор». Его создатели обращаются к истории средневековых поселений и удмуртским преданиям, знакомят с представлениями о жизни и верованиях предков. Это современный культурный проект, в котором художественные образы и легенды дополняют исторический рассказ.","https://dondy.kit-centr.ru/dondydor.html","https://udmurt.center/adam_center"],["Грахово","Одна из особенностей района — культурное многообразие: здесь живут удмурты, русские, марийцы, кряшены и чуваши. В деревне Благодатное сохраняются чувашские традиции; её история связана с переселением чувашей в начале XX века. Районный музей имени Ашальчи Оки знакомит с культурой местных народов и наследием первой удмуртской поэтессы.","https://nmur.ru/about/udmuseums/grahovo","https://minnac.ru/udm/chuvashi/"],["Дебёсы","История района связана с Сибирским трактом — большой дорогой, по которой двигались почта, товары, путешественники и ссыльные. Этой теме посвящён местный музей. Рядом с Дебёсами находится Байгурезь — возвышенность у реки Чепцы, связанная с археологическими памятниками и местными преданиями.","https://debesy.udmurt.ru/city/guestr/sibtrakt.php?type=pda","https://www.culture.ru/events/6556455/teatralizovannaya-ekskursiya-ob-istorii-sela-debesy-vot-na-puti-selo-bolshoe"],["Завьялово","Район окружает Ижевск, при этом столица Удмуртии является отдельным городским округом. Здесь расположен архитектурно-этнографический музей-заповедник «Лудорвай». В нём собраны образцы традиционной деревянной архитектуры: дома, хозяйственные постройки, ветряная мельница и семейное святилище — куала. Музей знакомит с устройством сельской усадьбы, ремёслами и повседневной жизнью.","https://www.culture.ru/institutes/22195/arkhitekturno-etnograficheskii-muzei-zapovednik-ludorvai"],["Игра","В деревне Сеп жители создали Музей исчезнувших деревень. В нём сохраняются фотографии, предметы быта и воспоминания о поселениях, которых больше нет. В деревне Сундур работает Центр удмуртской культуры, знакомящий с Лопшо Педунем — героем юмористических рассказов. Народная память сохраняется здесь и в семейных историях, и в фольклоре.","https://www.culture.ru/materials/256948/samye-kulturnye-gorodki-i-derevni-rossii","https://visitudmurtia.org/chto-posmotret/muzei-i-galerei/igrinskiy-rayonnyy-kraevedcheskiy-muzey/"],["Камбарка","История района связана с промышленностью и демидовским заводским хозяйством. Местные исторические материалы рассказывают о молотовых фабриках, кузницах и переработке металла. История Камбарки помогает понять, как заводы влияли на возникновение поселений, занятия жителей и развитие техники.","https://www.culture.ru/events/4962445/vystavka-ot-demidovskikh-vremen-do-nashikh-dnei","https://nmur.ru/about/udmuseums/kambarka"],["Каракулино","Одна из главных природных территорий района — парк «Усть-Бельск», связанный с местом встречи Камы и Белой. Каракулинская пойма имеет важное значение для охраны птиц и признана ключевой орнитологической территорией международного значения. Речные поймы, заливные луга и водоёмы необходимы для сохранения природного разнообразия.","https://base.garant.ru/15796738/"],["Кез","У села Кулига начинается Кама: большая река здесь представляет собой небольшой родниковый ручей. Кулига известна старообрядческой культурой. В местной традиции сохраняются навыки работы с деревом, в том числе изготовление долблёных корыт из цельного ствола. Историю этих мест собирает краеведческий музей «Истоки».","https://visitudmurtia.org/chto-posmotret/prirodnye-obekty-i-zapovedniki/istok-reki-kamy/","https://nmur.ru/about/udmuseums/kez"],["Кизнер","В районе находится село Короленко, прежде называвшееся Старым Мултаном. Оно связано с Мултанским делом конца XIX века и участием Владимира Короленко в защите несправедливо обвинённых удмуртов. В музее «Вуж Мултан» представлены материалы об этом деле и традиционном сельском быте. Эта история помогает говорить о справедливости, предрассудках и уважении к другим народам.","https://nmur.ru/wp-content/uploads/125-let-multanskomu-delu-%E2%80%94-kopiya.pdf","https://www.culture.ru/events/6662101/ekskursiya-ekho-multanskogo-dela"],["Киясово","С районом связано имя художника-баталиста Петра Кривоногова, автора картины «Победа». В Киясове работает посвящённый ему музей, где представлены картины, эскизы и фронтовые рисунки. Эти произведения позволяют увидеть, как художник наблюдал события войны и превращал впечатления в живописные образы.","https://www.culture.ru/institutes/10871/kiyasovskii-raionnyi-muzei-petra-aleksandrovicha-krivonogova"],["Красногорское","В районе расположен ботанический заказник «Кокманский». Здесь охраняются сосновые леса, верховые болота и материковые дюны — песчаные холмы вдали от морского побережья. Среди сосен сохранились старые лиственницы Сукачёва. Заказник находится на стыке природных подзон; здесь встречаются разные лесные и болотные сообщества.","https://mo-krasno.ru/nach-rayon/turizm/item/36582-kokmanskij.html?vi=1"],["Малая Пурга","Широкую известность району принесло село Бураново и ансамбль «Бурановские бабушки». В 2012 году коллектив занял второе место на конкурсе «Евровидение». Участницы исполняли на удмуртском языке в том числе версии известных популярных песен. Их выступления познакомили международную аудиторию с удмуртской речью и показали, как родной язык может звучать на современной сцене.","https://www.eurovision.com/eurovision-song-contest/baku-2012/participants/buranovskiye-babushki/"],["Можга","Город Можга является отдельным муниципальным образованием. Значительная часть района расположена в бассейне Валы. По берегам Валы и её притоков — Сюги и Ныши — находятся многие поселения. В районе сохраняются удмуртские сельские традиции и праздники. Один из них — Гербер, связанный с завершением весенних полевых работ.","https://udmurtia-gov.ru/doc/25332","https://mozhga-rayon.ru/about/info/news/9096/"],["Сигаево","Город Сарапул является отдельным муниципальным образованием. Часть района входит в национальный парк «Нечкинский», где охраняются леса и природные комплексы долины Камы. В селе Нечкино находится Музей орлана-белохвоста. Эта крупная хищная птица занесена в Красную книгу России; для неё важно сохранять речные берега и места гнездования.","https://oopt.info/index.php?oopt=846","https://udm.travel/places/muzei/muzei-estestvennykh-nauk/muzey-orlana-belokhvosta/"],["Селты","Развитие села связано с Сибирским трактом: большая дорога способствовала торговле и росту поселения. Сегодня об этом напоминает историческая парковая зона «Сибирский тракт в миниатюре». В ней представлены деревянные модели зданий из нескольких районов Удмуртии — храмов, купеческих домов, торговой лавки и этапного пункта. Есть модели сохранившихся и утраченных построек.","https://visitudmurtia.org/chto-posmotret/parki-obshchestvennye-prostranstva-i-smotrovye-ploshchadki/sibirskiy-park-miniatyur/"],["Сюмси","Через село Сюмси протекает Сюмсилка, впадающая в Кильмезь. История района связана с южной ветвью Сибирского тракта. В деревне Васькино сохранился сад со скульптурами Михаила Абашева. Народный мастер создавал фигуры людей, животных и сказочных персонажей, превращая пространство вокруг дома в собственный художественный мир.","https://waterresources.ru/reki/syumsilka/","https://visitudmurtia.org/marshruty/avtomarshruty/marshrut-vykhodnogo-dnya-syumsi-i-syumsinskiy-rayon"],["Ува","Развитие посёлка в XX веке связано с лесозаготовками, переработкой древесины и железной дорогой. История Увы показывает, как освоение лесных ресурсов влияло на появление новых производств и поселений. Около деревни Эрестем установлен знак географического центра Удмуртии.","https://www.culture.ru/events/6509656/ekskursiya-100-shagov-istorii","https://www.iz-article.ru/uvinsk.html"],["Шаркан","В районе расположен природный парк «Шаркан», охраняющий местные ландшафты и природные сообщества. В 2014 году деревня Старые Быги стала первой культурной столицей финно-угорского мира. Здесь развиваются проекты, связанные с удмуртским языком, традиционной кухней и сельской культурой, в том числе фестиваль «Быг-Быг».","https://base.garant.ru/412727777/","https://visitudmurtia.org/chto-posmotret/usadby-i-turistichesike-kompleksy/derevnya-starye-bygi/"],["Юкаменское","Район расположен на северо-западе Удмуртии и относится к местам компактного проживания бесермян — отдельного народа со своими культурными традициями. В местном музее знакомятся с устройством бесермянского жилища, домашней утварью и национальной одеждой. Особенности костюма рассказывают о возрасте человека и его положении в семье.","https://old.bigenc.ru/ethnology/text/2802239","https://www.culture.ru/events/6435937/vystavka-besermyanskaya-izba"],["Якшур-Бодья","Здесь сохраняют и изучают удмуртский фольклор, традиционный костюм и предметы сельского быта. Районный краеведческий музей носит имя Марии Шкляевой — его первого руководителя. Собранные вещи и воспоминания стали основой рассказа о местной истории. Часть этнографической коллекции представлена в экспозиции «Музей удмуртской сказки».","https://visitudmurtia.org/chto-posmotret/muzei-i-galerei/yakshur-bodinskiy-rayonnyy-kraevedcheskiy-muzey-imeni-marii-kirillovny-shklyaevoy/"],["Яр","Одно из исторических поселений района — Пудем, развитие которого связано с металлургическим заводом. Для производственных нужд в XVIII веке здесь создали пруд, сохранившийся до наших дней. История Пудема показывает, как промышленность меняла природу и как созданные человеком водоёмы становились частью повседневной жизни поселения.","https://visitudmurtia.org/chto-posmotret/prirodnye-obekty-i-zapovedniki/pudemskiy-prud/","https://www.culture.ru/events/4329437/fotokvest-v-stile-selfi-zagadki-pudema"]];
const CITIES=[{"name":"Ижевск","x":187,"y":289,"dx":-9,"dy":-9,"anchor":"end","note":"Столица Удмуртской Республики. Отдельный городской округ."},{"name":"Глазов","x":146,"y":89,"dx":-9,"dy":-9,"anchor":"end","note":"Город на севере Удмуртии. Отдельный городской округ."},{"name":"Воткинск","x":251,"y":266,"dx":9,"dy":-9,"anchor":"start","note":"Отдельный городской округ и административный центр Воткинского района."},{"name":"Можга","x":117,"y":351,"dx":-9,"dy":-9,"anchor":"end","note":"Отдельный городской округ и административный центр Можгинского района."},{"name":"Сарапул","x":233,"y":338,"dx":9,"dy":-9,"anchor":"start","note":"Отдельный городской округ. Административный центр Сарапульского района — село Сигаево."},{"name":"Камбарка","x":268,"y":369,"dx":9,"dy":16,"anchor":"start","note":"Город и административный центр Камбарского района."}];
let showCities=true;
function cityLayer(cover=false){return CITIES.map((c,i)=>`<g class="city-pin" ${cover?'aria-hidden="true"':'data-city="'+i+'" tabindex="0" role="button" aria-label="'+esc(c.name)+'"'}><rect x="${c.anchor==='end'?c.x+c.dx-c.name.length*6:c.x-10}" y="${c.y-21}" width="${c.name.length*6+24}" height="44" fill="transparent"/><circle cx="${c.x}" cy="${c.y}" r="9" fill="transparent"/><circle cx="${c.x}" cy="${c.y}" r="3.5"/><text x="${c.x+c.dx}" y="${c.y+c.dy}" text-anchor="${c.anchor}">${esc(c.name)}</text></g>`).join('')}

let language='ru',screen='home',mode='free',minutes=10,game=null,selected=null,hintLevel=0,hinted=null,zoom=1,dialog=null,status='game.select',statusArgs={},quiz=null,drag=null,suppress=0,effects=true,music=false,reduced=false,audio=null,pending=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(key,args={}){return (DATA.i18n[language][key]||DATA.i18n.ru[key]||key).replace(/\{([^}]+)\}/g,(m,k)=>args[k]??m)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({game,language,effects,music,reduced}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem(KEY));if(s){if(['ru','udm'].includes(s.language))language=s.language;let g=s.game;if(g&&g.v===1&&Array.isArray(g.order)&&g.order.length===25&&new Set(g.order).size===25&&g.order.every(id=>DATA.regions.some(r=>r.id===id))&&Array.isArray(g.placed)&&new Set(g.placed).size===g.placed.length&&g.placed.every(id=>g.order.includes(id))&&Number.isFinite(g.remaining)&&Number.isFinite(g.elapsed))game=g;effects=s.effects!==false;reduced=!!s.reduced}}catch(e){}
const region=id=>DATA.regions.find(r=>r.id===id),name=id=>region(id)?.name||'',clock=s=>Math.floor(Math.max(0,s)/60)+':'+String(Math.floor(Math.max(0,s)%60)).padStart(2,'0');
function button(k,a,cls='',args={}){return `<button class="${cls}" data-action="${a}">${esc(t(k,args))}</button>`}
function icon(r){return `<svg viewBox="${r.box.join(' ')}" aria-hidden="true"><path d="${r.d}" fill="${r.color}" stroke="#fffaf3" stroke-width=".6"/></svg>`}
function currentGroup(){if(!game)return [];let i=0;while(i<25&&game.order.slice(i,i+5).every(id=>game.placed.includes(id)))i+=5;return game.order.slice(i,i+5).filter(id=>!game.placed.includes(id))}
function svg(cover=false){let hint='';if(!cover&&hinted&&hintLevel<3){let b=region(hinted).box;hint=`<circle cx="${b[0]+b[2]/2}" cy="${b[1]+b[3]/2}" r="${hintLevel===1?105:Math.max(b[2],b[3])*.65}" fill="#d8ad6040" stroke="#a83d41" stroke-dasharray="4 3" pointer-events="none"/>`}
return `<svg class="map-svg" role="group" aria-label="${esc(t('game.title'))}" viewBox="${DATA.viewBox}" style="transform:scale(${cover?1:zoom});transform-origin:center">${DATA.regions.map(r=>`<path class="slot ${cover||screen==='atlas'||game?.placed.includes(r.id)?'placed':''} ${!cover&&hinted===r.id&&hintLevel>=3?'hint':''}" style="--fill:${r.color}" d="${r.d}" ${cover?'':`data-slot="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)}"`}><title>${esc(r.name)}</title></path>`).join('')}${hint}${showCities?cityLayer(cover):''}</svg>`}
function setStatus(k,args={}){status=k;statusArgs=args;if($('#status'))$('#status').textContent=t(k,args)}
function render(){document.documentElement.lang=language;document.documentElement.classList.toggle('reduced',reduced);document.title=t('app.title');$('#brand').textContent=t('app.title');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===language));$('#footer').textContent=t('map.note');
if(screen==='home'){$('#app').innerHTML=`<section class="home"><div class="intro"><div class="eyebrow">25 · УДМУРТИЯ</div><h1>${esc(t('app.title'))}</h1><p class="muted">${esc(t('app.subtitle'))}</p><div class="modes"><button class="mode ${mode==='free'?'active':''}" data-mode="free"><strong>∞ &nbsp;${esc(t('mode.free'))}</strong><span>${esc(t('mode.free.description'))}</span></button><button class="mode ${mode==='timed'?'active':''}" data-mode="timed"><strong>◷ &nbsp;${esc(t('mode.timed'))}</strong><span>${esc(t('mode.timed.description'))}</span></button></div>${mode==='timed'?`<div class="times">${button('time.five','five','small')}${button('time.ten','ten','small')}<label>${esc(t('time.minutes'))} <input type="number" id="minutes" min="1" max="60" step="1" value="${minutes}"></label></div>`:''}<div class="actions">${game?button('home.resume','resume','primary')+button('timeout.new','start'):button('home.start','start','primary')}${button('home.atlas','atlas')}${button('home.how','rules','quiet')}</div><p class="note">${esc(t('map.note'))}</p></div><div class="cover"><div class="cover-label">${esc(t('atlas.title'))}</div>${svg(true)}</div></section>`}
else{let atlas=screen==='atlas',n=game?.placed.length||0;$('#app').innerHTML=`<div class="game-head"><div><div class="eyebrow">25 · ${esc(t(atlas?'home.atlas':game.mode==='timed'?'mode.timed':'mode.free'))}</div><h2>${esc(t(atlas?'atlas.title':quiz?'quiz.title':'game.title'))}</h2></div><div class="progress"><div class="stats"><span>${esc(t('game.progress',{placed:n,total:25}))}</span><b id="timer">${atlas?'':clock(game.mode==='timed'?game.remaining:game.elapsed)}</b></div><div class="track"><i style="width:${n*4}%"></i></div><div class="stats"><span>${atlas?'':esc(t('game.group',{current:Math.min(5,Math.floor(n/5)+1),total:5}))}</span><span>${atlas?'':esc(t(game.mode==='timed'?'mode.timed':'mode.free'))}</span></div></div></div><div class="workspace"><section class="map-panel"><div class="compass">${esc(t('map.north'))}<b>↑</b>✧</div><div class="map-tools"><button data-action="cities" aria-pressed="${showCities}" title="Показать или скрыть города">${showCities?'●':'○'} Города</button><button data-action="out" aria-label="${esc(t('game.zoomOut'))}">−</button><button data-action="reset" aria-label="${esc(t('game.zoomReset'))}">⌖</button><button data-action="in" aria-label="${esc(t('game.zoomIn'))}">+</button></div><div class="map-wrap">${svg()}</div><div class="map-foot"><span>${esc(t('map.west'))} ←</span><span>↓ ${esc(t('map.south'))}</span><span>→ ${esc(t('map.east'))}</span></div></section><aside class="tray">${atlas?`<h3>${esc(t('home.atlas'))}</h3><input class="search" id="search" placeholder="${esc(t('atlas.search'))}"><div class="atlas-list" id="atlasList">${atlasList('')}</div>`:quiz?`<h3>${esc(t('quiz.title'))}</h3><div class="notice">${esc(t('quiz.find',{name:name(quiz.ids[quiz.index])}))}</div><p class="muted">${quiz.index+1} / ${quiz.ids.length}</p>${button('quiz.finish','endQuiz')}`:`<h3>${esc(t('game.tray'))}</h3><p class="muted" style="font-size:13px">${esc(t(selected?'game.place':'game.select'))}</p><div class="tray-list">${currentGroup().map(id=>`<button class="piece ${selected===id?'active':''}" data-piece="${id}" aria-pressed="${selected===id}">${icon(region(id))}<span>${esc(name(id))}</span></button>`).join('')||`<div class="notice">${esc(t('finish.title'))}</div>`}</div><div class="tray-bottom">${button('hint.button','hint','small')}${selected?`<p style="margin-top:10px">${esc(t('game.selected',{name:name(selected)}))}</p>`:''}</div>`}</aside></div><div class="status" role="status"><i></i><span id="status">${esc(t(atlas?'atlas.instruction':status,statusArgs))}</span></div><div class="actions">${button('game.home','home','small')}${!atlas&&!quiz?button('game.pause','pause','small')+button('game.restart','restart','small'):''}${!atlas&&!quiz&&n===25?button('finish.quiz','quiz','small'):''}${button('home.how','rules','small quiet')}${button('settings.title','settings','small quiet')}</div>`}renderDialog()}
function atlasList(query){let found=DATA.regions.filter(r=>r.name.toLowerCase().includes(query.toLowerCase()));return found.length?found.map(r=>`<button data-card="${r.id}">${esc(r.name)}</button>`).join(''):`<p>${esc(t('atlas.empty'))}</p>`}
function newGame(config={mode,minutes}){let order=DATA.regions.map(r=>r.id);for(let i=24;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}game={v:1,order,placed:[],mode:config.mode,duration:config.minutes*60,remaining:config.minutes*60,elapsed:0,hints:0,opened:[]};screen='game';quiz=null;selected=null;hinted=null;hintLevel=0;dialog=null;zoom=1;status='game.select';statusArgs={};save();render()}
function open(type,id){dialog={type,id};renderDialog()}
function close(){dialog=null;$('#modal').classList.add('hidden')}
function renderDialog(){let el=$('#modal');if(!dialog){el.classList.add('hidden');return}el.classList.remove('hidden');let {type,id}=dialog,title='',body='',actions='';
if(type==='card'){title=name(id);let c=REGION_CARDS[id-1], f=DISTRICT_SECTIONS[id-1];let parts=[['card.location','Административный центр — '+c[0]+'.'],['card.history',f[0]],['card.nature',f[1]],['card.culture',f[2]],['card.visit',f[3]]];body=icon(region(id))+(language==='udm'?'<p class="notice">Описание пока доступно на русском языке. Удмуртский перевод готовится.</p>':'')+'<div class="district-sections">'+parts.map(([k,v])=>'<section class="info-section"><h3>'+esc(t(k))+'</h3><p lang="ru" class="'+(v?'':'muted')+'">'+esc(v||'Раздел дополняется: проверенные сведения пока не добавлены.')+'</p></section>').join('')+'<section class="info-section"><h3>'+esc(t('card.sources'))+'</h3><ol>'+c.slice(2).map(u=>'<li><a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(new URL(u).hostname)+'</a></li>').join('')+'</ol></section></div>'+(game?.mode==='timed'&&screen==='game'?'<p class="note">'+esc(t('card.timerPaused'))+'</p>':'');actions=button('card.back','close','primary')}
if(type==='city'){let c=CITIES[id];title=c.name;body='<article lang="ru" class="district-copy"><p>'+esc(c.note)+'</p><p class="note">Положение города обозначено на схематической карте. Подробная карточка города готовится.</p></article>';actions=button('card.back','close','primary')}
if(type==='rules'){title=t('rules.title');body=['rules.step1','rules.step2','rules.step3','rules.step4','rules.step5'].map((k,i)=>`<div class="rule"><b>${i+1}</b><p>${esc(t(k))}</p></div>`).join('')+`<p class="note">${esc(t('rules.random'))}</p>`;actions=button('action.continue','close','primary')}
if(type==='pause'){title=t('pause.title');body=`<p>${esc(t('pause.body'))}</p>`;actions=button('pause.resume','close','primary')}
if(type==='restart'){title=t('restart.title');body=`<p>${esc(t('restart.body'))}</p>`;actions=button('action.cancel','close')+button('timeout.new','confirmNew','primary')}
if(type==='timeout'){title=t('timeout.title');body=`<p>${esc(t('timeout.body',{placed:game.placed.length,total:25}))}</p>`;actions=button('timeout.continue','untimed','primary')+button('timeout.new','timeoutNew')}
if(type==='finish'){title=t('finish.title');body=`<p>${esc(t('finish.body'))}</p><div class="notice">${esc(t('finish.time',{time:clock(game.elapsed)}))}<br>${esc(t('finish.hints',{count:game.hints}))}<br>${esc(t('finish.cards',{opened:game.opened.length,total:25}))}</div>`;actions=button('finish.read','close','primary')+button('finish.quiz','quiz')+button('finish.again','timeoutNew')}
if(type==='quizResult'){title=t('quiz.title');body=`<p class="notice">${esc(t('quiz.result',{correct:quiz.correct,total:quiz.ids.length}))}</p>`;actions=button('quiz.finish','endQuiz','primary')+(quiz.wrong.length?button('quiz.repeat','repeatQuiz'):'')}
if(type==='settings'){title=t('settings.title');body=`<div class="settings"><label><input type="checkbox" id="effects" ${effects?'checked':''}>${esc(t('settings.effects'))}</label><label><input type="checkbox" id="music" ${music?'checked':''} ${DATA.music?'':'disabled'}>${esc(t('settings.music'))}</label><label><input type="checkbox" id="reduced" ${reduced?'checked':''}>${esc(t('settings.motion'))}</label></div>`;actions=button('action.close','close','primary')}
el.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">${esc(title)}</h2>${type==='timeout'?'':`<button data-action="close" class="small quiet" aria-label="${esc(t('a11y.close'))}">✕</button>`}</div><div class="languages" style="width:max-content;margin-bottom:18px"><button data-lang="ru" class="${language==='ru'?'active':''}">Русский</button><button data-lang="udm" class="${language==='udm'?'active':''}">Удмурт</button></div><div class="dialog-body">${body}</div><div class="actions">${actions}</div></section>`;el.querySelector('button')?.focus()}
function card(id){if(screen!=='atlas'&&!game?.placed.includes(id))return;if(game&&!game.opened.includes(id)){game.opened.push(id);save()}open('card',id)}
function tone(){if(!effects)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(660,c.currentTime);o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.12);g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.24);o.start();o.stop(c.currentTime+.25);o.onended=()=>c.close()}catch(e){}}
function place(id){if(!game||game.placed.includes(id)||!currentGroup().includes(id))return;game.placed.push(id);selected=null;hinted=null;hintLevel=0;status=game.placed.length%5===0&&game.placed.length<25?'game.groupComplete':'game.info';statusArgs={};tone();save();render();if(game.placed.length===25)open('finish')}
function slot(id){if(quiz){let answer=quiz.ids[quiz.index];if(id!==answer){quiz.failed=true;if(!quiz.wrong.includes(answer))quiz.wrong.push(answer);setStatus('quiz.retry');return}if(!quiz.failed)quiz.correct++;quiz.index++;quiz.failed=false;tone();if(quiz.index===quiz.ids.length)open('quizResult');else{status='quiz.correct';render()}return}if(screen==='atlas'||game?.placed.includes(id)){card(id);return}if(selected===id)place(id);else setStatus(selected?'game.retry':'game.select')}
function startQuiz(ids){screen='game';quiz={ids:ids||game.order.slice(0,5),index:0,correct:0,wrong:[],failed:false};selected=null;hinted=null;dialog=null;status='quiz.title';render()}
document.addEventListener('click',e=>{if(Date.now()<suppress)return;let city=e.target.closest('[data-city]');if(city){open('city',+city.dataset.city);return}let b=e.target.closest('[data-lang]');if(b){language=b.dataset.lang;save();render();return}b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;render();return}b=e.target.closest('[data-piece]');if(b){selected=+b.dataset.piece;hinted=null;hintLevel=0;status='game.place';render();return}b=e.target.closest('[data-slot]');if(b){slot(+b.dataset.slot);return}b=e.target.closest('[data-card]');if(b){card(+b.dataset.card);return}let a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;
if(a==='cities'){showCities=!showCities;render();return}
if(a==='start'){if(mode==='timed'){minutes=Number($('#minutes').value);if(!Number.isInteger(minutes)||minutes<1||minutes>60){$('#minutes').setCustomValidity(t('time.validation'));$('#minutes').reportValidity();return}}pending={mode,minutes};if(game)open('restart');else newGame(pending)}
if(a==='resume'){screen='game';quiz=null;dialog=null;selected=null;status='game.select';render();if(game.mode==='timed'&&game.remaining<=0&&game.placed.length<25)open('timeout')}
if(a==='five'||a==='ten'){minutes=a==='five'?5:10;render()}
if(a==='atlas'){screen='atlas';quiz=null;dialog=null;selected=null;zoom=1;render()}
if(a==='home'){screen='home';quiz=null;dialog=null;save();render()}
if(['rules','pause','settings'].includes(a))open(a);
if(a==='restart'){pending={mode:game.mode,minutes:game.duration/60};open('restart')}
if(a==='confirmNew')newGame(pending);
if(a==='timeoutNew')newGame({mode:game.mode,minutes:game.duration/60});
if(a==='close')close();
if(a==='untimed'){game.mode='free';dialog=null;save();render()}
if(a==='hint'){if(!selected){setStatus('game.select');return}hintLevel++;hinted=selected;game.hints++;status=hintLevel===1?'hint.direction':hintLevel===2?'hint.area':'hint.position';save();render()}
if(a==='in'){zoom=Math.min(1.8,zoom+.2);render()}if(a==='out'){zoom=Math.max(.6,zoom-.2);render()}if(a==='reset'){zoom=1;render()}
if(a==='quiz')startQuiz();if(a==='endQuiz'){quiz=null;dialog=null;status='finish.title';render()}if(a==='repeatQuiz')startQuiz(quiz.wrong.slice())});
document.addEventListener('input',e=>{if(e.target.id==='minutes'){minutes=+e.target.value;e.target.setCustomValidity('')}if(e.target.id==='search')$('#atlasList').innerHTML=atlasList(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='effects')effects=e.target.checked;if(e.target.id==='reduced'){reduced=e.target.checked;document.documentElement.classList.toggle('reduced',reduced)}if(e.target.id==='music'){music=e.target.checked;if(!audio&&DATA.music){audio=new Audio(DATA.music);audio.loop=true;audio.volume=.18}if(audio){if(music)audio.play().catch(()=>{});else audio.pause()}}save()});
document.addEventListener('keydown',e=>{if(dialog){if(e.key==='Escape'&&dialog.type!=='timeout'){close();return}if(e.key==='Tab'){let controls=[...$('#modal').querySelectorAll('button,input')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus()}}return}let city=e.target.closest('[data-city]');if(city&&['Enter',' '].includes(e.key)){e.preventDefault();open('city',+city.dataset.city);return}let s=e.target.closest('[data-slot]');if(s&&['Enter',' '].includes(e.key)){e.preventDefault();slot(+s.dataset.slot)}});
document.addEventListener('pointerdown',e=>{let p=e.target.closest('[data-piece]');if(p&&e.button===0)drag={id:+p.dataset.piece,x:e.clientX,y:e.clientY,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(drag.moved){$('#ghost').innerHTML=icon(region(drag.id));$('#ghost').classList.remove('hidden');$('#ghost').style.left=e.clientX+'px';$('#ghost').style.top=e.clientY+'px'}});
document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;$('#ghost').classList.add('hidden');if(!d.moved)return;suppress=Date.now()+250;selected=d.id;let hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');if(hit&&+hit.dataset.slot===d.id){place(d.id);return}let p=document.querySelector(`[data-slot="${d.id}"]`),r=p?.getBoundingClientRect();if(r&&Math.hypot(e.clientX-r.x-r.width/2,e.clientY-r.y-r.height/2)<Math.max(16,Math.min(r.width,r.height)*.3)){place(d.id);return}status='game.retry';render()});
document.addEventListener('pointercancel',()=>{drag=null;$('#ghost').classList.add('hidden')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game'&&!dialog&&game?.placed.length<25)open('pause')});
let last=performance.now(),saveTick=0;setInterval(()=>{let now=performance.now(),dt=Math.min((now-last)/1000,2);last=now;if(!game||screen!=='game'||dialog||quiz||document.hidden||game.placed.length===25)return;game.elapsed+=dt;if(game.mode==='timed')game.remaining=Math.max(0,game.remaining-dt);if($('#timer'))$('#timer').textContent=clock(game.mode==='timed'?game.remaining:game.elapsed);if(game.mode==='timed'&&game.remaining===0)open('timeout');saveTick+=dt;if(saveTick>1){save();saveTick=0}},250);
window.addEventListener('pagehide',save);window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='udm-platform-language'&&['ru','udm'].includes(e.data.language)){language=e.data.language;save();render()}});
render();
</script>

<script>
window.udmCloseGame=function(){save();if(audio)audio.pause();};
document.getElementById('portal-return').addEventListener('click',function(e){if(parent!==window){e.preventDefault();window.udmCloseGame();parent.postMessage({type:'udm-return-to-hub'},'*');}});
</script><script src="../../assets/viewport-fit.js"></script></body></html>
