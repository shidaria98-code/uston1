  - name: cheskyt-lexicon
    label: "Ческыт · словарь"
    type: file
    path: content/cheskyt/lexicon.json
    format: json
    operations: {create: false, delete: false, rename: false}
    fields:
      - {name: schemaVersion, type: number, readonly: true, required: true}
      - name: entries
        type: object
        list: {min: 50, max: 50, collapsible: {collapsed: true, summary: "{fields.ru}"}}
        fields:
          - {name: id, type: string, readonly: true, required: true}
          - {name: category, type: string, readonly: true, required: true}
          - {name: ru, label: "Русский", type: string, required: true}
          - {name: udm, label: "Удмуртский", type: string, required: true}
          - {name: status, label: "Статус вычитки", type: string, required: true}
          - {name: sourceNote, label: "Пометка для вычитки", type: text}
          - {name: icon, type: string, readonly: true}
          - {name: dictionaryId, type: string, readonly: true}
