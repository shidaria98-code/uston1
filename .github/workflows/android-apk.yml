name: Android offline APK
on:
  push:
    branches: [android-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-test-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Prepare full offline portal
        run: |
          pnpm run build:android-web
          pnpm exec cap add android
          pnpm exec cap sync android
      - name: Existing content checks
        run: node tests/november-content.cjs
      - name: Browser regression with external network blocked
        run: |
          pnpm exec playwright install --with-deps chromium
          python3 -m http.server 8771 --directory dist-android >/tmp/uston-http.log 2>&1 &
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node tests/mvp-regression.cjs
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify every bundled file in APK
        run: python3 scripts/verify-apk.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK with airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uston-offline-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            tests/results.json
            work-verification/
          retention-days: 30
