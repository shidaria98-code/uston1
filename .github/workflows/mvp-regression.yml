name: MVP regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8771 >/tmp/uston-http.log 2>&1 &
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node tests/mvp-regression.cjs
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" USTON_TEST_URL=http://127.0.0.1:8771/ node tests/dictionary-training.cjs
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" USTON_TEST_URL=http://127.0.0.1:8771/ node tests/conjugation-integration.cjs
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" USTON_TEST_URL=http://127.0.0.1:8771/ node tests/landing-shop.cjs
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" USTON_TEST_URL=http://127.0.0.1:8771/ node tests/case-forms.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-regression-results
          path: |
            tests/results.json
            tests/dictionary-training-results.json
            tests/conjugation-results.json
            tests/landing-shop-results.json
